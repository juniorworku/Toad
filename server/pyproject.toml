[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "toad-server"
version = "0.1.0"
description = "Python engine for the Toad Kotlin Android desk companion"
requires-python = ">=3.12"
dependencies = [
  "openai>=3.24,<4",
  "anyio>=4,<5",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "httpx>=0.27,<1",
  "websockets>=13,<16",
  "composio>=0.25,<0.26",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.8,<1", "mypy>=1.13,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.setuptools.package-data]
toad_server = ["assets/*.css", "assets/*.js", "public/*.html", "py.typed"]
